<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="sidebar">
    <h1>Tasks</h1>
    <div class="filter active" data-filter="all">
      <span class="filter-label">All Tasks</span>
      <span class="count" id="count-all">0</span>
    </div>
    <div class="filter" data-filter="pending">
      <span class="filter-label"><span class="filter-dot" style="background:var(--status-pending)"></span>Pending</span>
      <span class="count" id="count-pending">0</span>
    </div>
    <div class="filter" data-filter="in-progress">
      <span class="filter-label"><span class="filter-dot" style="background:var(--status-progress)"></span>In Progress</span>
      <span class="count" id="count-progress">0</span>
    </div>
    <div class="filter" data-filter="completed">
      <span class="filter-label"><span class="filter-dot" style="background:var(--status-done)"></span>Completed</span>
      <span class="count" id="count-completed">0</span>
    </div>
    <div class="sidebar-footer">Task Management API</div>
  </div>

  <div class="main">
    <div class="topbar">
      <h2 id="view-title">All Tasks</h2>
      <button class="new-btn" id="new-task-btn">New Task</button>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="panel" id="panel">
  <div class="panel-header">
    <h3 id="panel-title">New Task</h3>
    <button class="close-btn" id="close-btn">&times;</button>
  </div>
  <div class="panel-body">
    <div class="field">
      <label>Title</label>
      <input type="text" id="f-title" placeholder="Task title">
    </div>
    <div class="field">
      <label>Description</label>
      <textarea id="f-desc" placeholder="Optional details"></textarea>
    </div>
    <div class="field">
      <label>Status</label>
      <select id="f-status">
        <option value="pending">Pending</option>
        <option value="in-progress">In Progress</option>
        <option value="completed">Completed</option>
      </select>
    </div>
    <div class="field">
      <label>Due Date</label>
      <input type="date" id="f-due">
    </div>
  </div>
  <div class="panel-footer">
    <button class="btn-primary" id="save-btn">Save Task</button>
    <button class="btn-danger" id="delete-btn" style="display:none">Delete</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>

</body>
</html>
